server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: linghu-backend

  # 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/linghu_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    hikari:
      connection-init-sql: "SET NAMES utf8mb4 COLLATE utf8mb4_unicode_ci"
    username: root
    password: linghu123

  # Redis 配置
  redis:
    host: localhost
    port: 6379
    database: 0
    timeout: 3000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0

  # RabbitMQ 配置
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    publisher-confirm-type: correlated
    publisher-returns: true

  # 文件上传配置
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 20MB

  # Jackson 配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

  # 跨域配置（开发环境）
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 配置
jwt:
  secret: linghu-secret-key-2024-linghu-backend-production
  expiration: 604800  # 7天（秒）
  header: Authorization
  prefix: "Bearer "

# 支付宝配置（填入真实商户信息后自动启用）
alipay:
  enabled: false                           # 设为 true 并填入真实配置后启用
  app-id: YOUR_ALIPAY_APPID
  private-key: YOUR_RSA2_PRIVATE_KEY
  public-key: YOUR_ALIPAY_PUBLIC_KEY
  gateway: https://openapi.alipay.com/gateway.do
  notify-url: https://www.aifox.club/api/payment/alipay/notify
  return-url: https://www.aifox.club/#/payment/result

# 微信小程序配置
wechat:
  miniapp:
    appid: wxb6997bebf3aa9e11
    secret: 5f3429630d9c947e403e235e79cbb942

  # 微信支付配置（填入真实商户信息后自动启用）
  pay:
    enabled: false                         # 设为 true 并填入真实配置后启用
    app-id: YOUR_WECHAT_APPID
    mch-id: YOUR_MCH_ID
    api-v3-key: YOUR_API_V3_KEY
    cert-serial-no: YOUR_CERT_SERIAL_NO
    private-key-path: classpath:wechat/apiclient_key.pem
    notify-url: https://www.aifox.club/api/payment/wechat/notify

# 日志配置
logging:
  level:
    com.linghu: debug
    org.springframework.security: info

